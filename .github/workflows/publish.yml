name: Publish

# Publishes to npm when a version tag (e.g. 1.0.1, 1.0.1-beta.1) is pushed,
# once the same tests that gate pull requests pass. Stable versions get the
# `latest` dist-tag; prereleases get `prerelease`.
# release.yml also dispatches it against the tag it creates, since tags pushed
# with GITHUB_TOKEN don't trigger `push` workflows.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  test:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later, newer than the npm bundled
      # with Node 24 releases before 24.5.0, which a runner may have cached.
      - name: Update npm
        run: npm install --global npm@^11.5.1

      - name: Check tag matches package.json version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" && exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          dist_tag=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo prerelease || echo latest)
          npm publish --access public --tag "$dist_tag"
